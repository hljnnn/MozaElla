<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Message For You</title>
    <style>

          @media (max-width: 400px) {
            .time-box { min-width: 50px; padding: 10px; }
            h1 { font-size: 1.5rem; }
        }
        body {
            background-color: #fff0f3;
            font-family: 'Segoe UI', cursive, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden; /* Keeps hearts within bounds */
            position: relative;
        }

        /* --- Floating Hearts Effect --- */
        .heart-bg {
            position: absolute;
            top: -10%;
            color: rgba(255, 77, 109, 0.3);
            font-size: 1.5rem;
            user-select: none;
            z-index: 0;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) translateX(20px);
            }
        }

        /* --- Content Card --- */
        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 2px solid #ffb3c1;
            z-index: 10; /* Above the hearts */
            animation: fadeIn 2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { color: #ff4d6d; font-size: 2rem; margin-bottom: 20px; }
        p { color: #590d22; line-height: 1.6; font-size: 1.2rem; }

        /* --- Fingerprint Section --- */
.fingerprint-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  user-select: none;
}

.fingerprint-icon {
  width: 90px;
  height: 90px;
  filter: drop-shadow(0 0 10px #00ffff);
  overflow: hidden;
  position: relative;
}

.fingerprint-paths path {
  stroke: #ff6fbe;
  stroke-dasharray: 300;
  stroke-dashoffset: 300;
  transition: stroke-dashoffset 2.5s linear;
}

.scan-line {
  fill: rgba(255, 121, 204, 0.945);
  transform: translateY(-30px);
  transition: transform 2.5s linear;
}

.fingerprint-container.active .fingerprint-paths path {
  stroke-dashoffset: 0;
}

.fingerprint-container.active .scan-line {
  transform: translateY(220px);
}

.hint {
  margin-top: 10px;
  font-size: 14px;
  opacity: 0.75;
  color: #ff6fbe;
}

    </style>
</head>
<body>

    <div class="card">
        <h1>Happy Valentine's Day!</h1>
        <p>
            To ella,<br><br>
            Sorry na dahil medyo late ito and sorry din kase palagi ako late reply sana patawarin hehehe.
            Sana magustuhan mo po :) 
        </p>

    <div class="fingerprint-container">
        <svg class="fingerprint-icon" viewBox="0 0 200 200">
         <g class="fingerprint-paths" fill="none" stroke-width="4" stroke-linecap="round">
            <path d="M100 30 C50 30 30 60 30 100" />
            <path d="M100 30 C150 30 170 60 170 100" />

            <path d="M50 100 C50 60 80 50 100 50 C120 50 150 60 150 100" />
            <path d="M65 100 C65 75 85 70 100 70 C115 70 135 75 135 100" />
            <path d="M80 100 C80 88 90 85 100 85 C110 85 120 88 120 100" />

            <path d="M100 100 C100 130 90 150 75 165" />
            <path d="M100 100 C100 130 110 150 125 165" />
            <path d="M100 100 C100 140 100 165 100 180" />
    </g>

            <rect class="scan-line" x="0" y="0" width="200" height="20"/>
        </svg>

        <span class="hint">Hold to unlock surprise</span>
    </div>

    </div>

    <script>
        /**
         * Create floating hearts dynamically
         */
        function createFallingElements() {
    const totalCount = 30; // Increased count to accommodate both
    const imagePath = 'falling2.jpg'; // Make sure this file is in your folder

    for (let i = 0; i < totalCount; i++) {
        const element = document.createElement('div');
        element.className = 'heart-bg';
        
        // Randomly decide if this one is a heart or a face
        if (Math.random() > 0.5) {
            // It's a Heart
            element.innerHTML = '❤️';
            element.style.fontSize = Math.random() * 20 + 15 + 'px';
        } else {
            // It's your Face
            const img = document.createElement('img');
            img.src = imagePath;
            const size = Math.random() * 30 + 30; // Size between 30px and 60px
            img.style.width = size + 'px';
            img.style.height = size + 'px';
            img.style.borderRadius = '50%';
            img.style.objectFit = 'cover';
            element.appendChild(img);
        }

        // Apply shared random animations
        element.style.left = Math.random() * 100 + 'vw';
        element.style.animationDuration = (Math.random() * 3 + 4) + 's'; 
        element.style.animationDelay = Math.random() * 5 + 's';
        element.style.opacity = Math.random() * 0.6 + 0.4;
        
        document.body.appendChild(element);
    }
}

createFallingElements();

        const container = document.querySelector('.fingerprint-container');
  let holdTimer;

  const HOLD_DURATION = 2500; // 2.5 seconds

  const startHold = (e) => {
    if (e.type === 'touchstart') e.preventDefault(); // Stop mobile context menu
    container.classList.add('active');
    holdTimer = setTimeout(() => {
        window.location.href = 'rose.html';
    }, HOLD_DURATION);
};

  const cancelHold = () => {
    container.classList.remove('active');
    clearTimeout(holdTimer);
  };

  container.addEventListener('mousedown', startHold);
  container.addEventListener('touchstart', startHold);

  container.addEventListener('mouseup', cancelHold);
  container.addEventListener('mouseleave', cancelHold);
  container.addEventListener('touchend', cancelHold);
    </script>

    <audio id="globalMusic" loop>
    <source src="untilifoundyou.mp3" type="audio/mpeg">
</audio>

<script>
    window.onload = function() {
        const audio = document.getElementById('globalMusic');
        const isMusicPlaying = localStorage.getItem('musicPlaying');
        const savedTime = localStorage.getItem('musicTimestamp');

        if (isMusicPlaying === 'true') {
            // 1. Set the time immediately before playing
            if (savedTime) {
                // We add a tiny offset (0.1s) to account for page load lag
                audio.currentTime = parseFloat(savedTime) + 0.1;
            }

            // 2. Start with volume at 0 for a smooth fade-in
            audio.volume = 0;
            
            audio.play().then(() => {
                // 3. Smooth Fade-In effect
                let vol = 0;
                const fadeIn = setInterval(() => {
                    if (vol < 1) {
                        vol += 0.05;
                        audio.volume = Math.min(vol, 1);
                    } else {
                        clearInterval(fadeIn);
                    }
                }, 50); // Increase volume every 50ms
            }).catch(error => {
                console.log("Interaction required to resume music.");
            });
        }

        // 4. Ultra-fast Sync (Updates every 100ms instead of 500ms)
        // This makes sure that if the user clicks a link suddenly, 
        // the saved timestamp is as accurate as possible.
        setInterval(() => {
            if (!audio.paused) {
                localStorage.setItem('musicTimestamp', audio.currentTime);
            }
        }, 100);
    };

    // 5. Save exactly when the user clicks a link/leaves
    window.onbeforeunload = function() {
        const audio = document.getElementById('globalMusic');
        if (audio) {
            localStorage.setItem('musicTimestamp', audio.currentTime);
        }
    };
</script>

</body>
</html>
